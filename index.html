<html>

<head>
  <link rel="stylesheet" href="style.css">
  <title>
    My SnowGLobe
  </title>
</head>

<body>
  <header>
    <h1>
      Cindy
    </h1>
    <p>
      Shake it for a little warmth in the cold
    </p>
  </header>
  <main>
    <section class="card">
      <div class="globe" id="globe">
        <img class="scene" src="snowglobe.png" alt="a snowglobe">
      </div>
      <button id="shake">
        Shake the Globe
      </button>
      <p class="message" id="message">
        Press the Button
      </p>
    </section>
  </main>
  <footer>
    <p>
      Made by me, in the freezing yet comforting snow
    </p>
  </footer>
  <script src="script.js"></script>
</body>

</html>
